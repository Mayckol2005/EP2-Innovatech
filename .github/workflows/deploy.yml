name: Build and Push Deploy

on:
  push:
    branches:
      - deploy

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend 1
        uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend-despachos:latest

      - name: Build and push backend 2
        uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend-ventas:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front_despacho
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest

      - name: Deploy backend ec2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_FRONTEND_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d --force-recreate

      - name: Deploy frontend ec2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d --force-recreate