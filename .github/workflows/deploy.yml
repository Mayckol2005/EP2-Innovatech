name: CI/CD Pipeline

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # BACKEND DESPACHOS
      #################################################
      - name: Build y Push Backend Despachos
        uses: docker/build-push-action@v4
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/back-despachos:latest

      #################################################
      # BACKEND VENTAS
      #################################################
      - name: Build y Push Backend Ventas
        uses: docker/build-push-action@v4
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          file: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/back-ventas:latest

      #################################################
      # FRONTEND
      #################################################
      - name: Build y Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/front-despachos:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Entrar a la carpeta del proyecto
            cd /home/${{ secrets.EC2_USER }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # 2. OPCIÓN NUCLEAR: Descargar el binario directamente en una ruta conocida
            # Esto ignora los repositorios de AWS y asegura que exista sí o sí
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

            # 3. EJECUTAR CON RUTA ABSOLUTA: Esto evita el error de "command not found"
            sudo /usr/local/bin/docker-compose pull
            sudo /usr/local/bin/docker-compose down
            sudo /usr/local/bin/docker-compose up -d