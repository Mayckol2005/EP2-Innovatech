name: CI/CD Pipeline

on:
  push:
    branches:
      - deploy # El pipeline se activa al hacer push en la rama deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # IMPORTANTE: Cambia "miusuario/mi-repo" por el tuyo en cada proyecto
          tags: ${{ secrets.DOCKER_USERNAME }}/nombre-de-tu-app:latest 

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en AWS EC2 por SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # El script que se ejecutará dentro de tu EC2
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/nombre-de-tu-app:latest
            docker-compose down
            docker-compose up -d