name: CI/CD Pipeline

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del cÃ³digo
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # BACKEND DESPACHOS
      #################################################
      - name: Build y Push Backend Despachos
        uses: docker/build-push-action@v4
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/back-despachos:latest

      #################################################
      # BACKEND VENTAS
      #################################################
      - name: Build y Push Backend Ventas
        uses: docker/build-push-action@v4
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          file: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/back-ventas:latest

      #################################################
      # FRONTEND
      #################################################
      - name: Build y Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/front-despachos:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Entrar al directorio principal del usuario ubuntu
            cd /home/${{ secrets.EC2_USER }}

            # Definir variables necesarias
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # Usar sudo y docker-compose (con guion) que es el instalado en tu EC2
            sudo docker-compose pull
            sudo docker-compose down
            sudo docker-compose up -d